<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feed My Horse</title>
  <meta name="description" content="Tracks the horse's feed boxes and when they run out.">
  <meta name="theme-color" content="#1c5e69">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Feed My Horse">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
  <!-- Plain scripts, not modules, so the page also runs when opened straight from disk. -->
  <script defer src="js/texts.js"></script>
  <script defer src="js/schedule.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/calendar.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="header">
      <img class="header-icon" src="img/icon-192.png" alt="">
      <div class="header-frame"><span id="horse-name"></span></div>
      <button id="options-button" class="header-options" type="button" aria-label="Options">
        <img src="img/options.png" alt="">
      </button>
      <div id="status" class="status"></div>
    </header>

    <main id="board" class="board"></main>

    <footer class="footer">
      <button id="refill-button" class="button button-primary" type="button" data-text="refill_button"></button>
      <button id="calendar-button" class="calendar-button" type="button" hidden>
        <!-- Line-art calendar with a bell, in the style of the sprites. -->
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="5" y="9" width="38" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <path d="M5 19h38M15 4v9M33 4v9" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M24 24c-4 0-6 3-6 6v4l-2 3h16l-2-3v-4c0-3-2-6-6-6zM22 38.5a2 2 0 0 0 4 0" fill="currentColor"/>
        </svg>
      </button>
    </footer>

    <div id="confirm-dialog" class="modal" hidden>
      <div class="panel dialog-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <button class="close-button" type="button" data-close aria-label="Close"><img src="img/close_button.png" alt=""></button>
        <h2 id="confirm-title" class="panel-title"></h2>
        <p id="confirm-message" class="dialog-message"></p>
        <div class="dialog-buttons">
          <button class="button button-secondary" type="button" data-close data-text="cancel"></button>
          <button id="confirm-ok" class="button button-primary" type="button" data-text="refill"></button>
        </div>
      </div>
    </div>

    <div id="options-panel" class="modal" hidden>
      <div class="panel options-panel" role="dialog" aria-modal="true" aria-labelledby="options-title">
        <button class="close-button" type="button" data-close aria-label="Close"><img src="img/close_button.png" alt=""></button>
        <h2 id="options-title" class="panel-title" data-text="options_title"></h2>
        <div class="options-content">
          <label class="options-label" for="horse-name-input" data-text="horse_name"></label>
          <input id="horse-name-input" class="field" type="text" maxlength="40" autocomplete="off">

          <div class="options-label" data-text="meal_times"></div>
          <div id="meal-rows" class="meal-rows"></div>
          <button id="add-meal" class="button button-secondary" type="button" aria-label="+">+</button>

          <div class="options-label" data-text="box_count"></div>
          <div class="stepper">
            <button id="box-minus" class="button button-secondary square" type="button" aria-label="–">–</button>
            <span id="box-count" class="stepper-value"></span>
            <button id="box-plus" class="button button-secondary square" type="button" aria-label="+">+</button>
          </div>
        </div>
        <div id="languages" class="languages"></div>
      </div>
    </div>
  </div>

  <template id="meal-row-template">
    <div class="meal-row">
      <img class="meal-row-icon" alt="">
      <input class="field time-field" type="time" required>
      <span class="spacer"></span>
      <button class="button button-secondary square" type="button" data-remove aria-label="–">–</button>
    </div>
  </template>
</body>
</html>
